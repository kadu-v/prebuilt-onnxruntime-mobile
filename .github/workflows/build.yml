name: Build ONNX Runtime

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.task }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: android
            runner: ubuntu-24.04
          - task: ios
            runner: macos-15
          - task: ios-sim
            runner: macos-15
          - task: ios-sim-x86_64
            runner: macos-15
          - task: macosx
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Pin CMake 3.x for all jobs (the runner's Homebrew CMake is 4.x; local builds use 3.29)
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Setup Android NDK
        if: matrix.task == 'android'
        run: |
          ndk_version="$(grep -m1 '^ANDROID_NDK_VERSION' android.env | cut -d'"' -f2)"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk_version}" > /dev/null
          # android.env points at a local machine path, so rewrite it for the runner
          printf 'ANDROID_SDK_HOME="%s"\nANDROID_NDK_VERSION="%s"\n' "${ANDROID_HOME}" "${ndk_version}" > android.env
          cat android.env

      # Unset the runner's preinstalled vcpkg so build.py clones the vcpkg release pinned by ONNX Runtime
      # (same as local builds). The preinstalled one picks up Homebrew's CMake 4.x and fails.
      - name: Build
        run: env -u VCPKG_INSTALLATION_ROOT uv run cargo make ${{ matrix.task }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ matrix.task }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: onnxruntime-*
          path: build/
          merge-multiple: true

      - name: Package
        id: package
        run: |
          cargo make package
          ort_version="$(grep -m1 '^ORT_VERSION' Makefile.toml | cut -d'"' -f2)"
          echo "zip=build/${ort_version}/onnxruntime-${ort_version}.zip" >> "${GITHUB_OUTPUT}"
          echo "name=onnxruntime-${ort_version}" >> "${GITHUB_OUTPUT}"
          # Tag push: release under that tag. Manual run: release under the ORT version tag (e.g. v1.28.0).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${ort_version}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ONNX Runtime ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.package.outputs.zip }}
          overwrite_files: true
