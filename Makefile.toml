[env]
ONNXRUNTIME_DIR_PATH = "onnxruntime"
ORT_VERSION = "v1.28.0"
DEST_DIR_PATH = "build/${ORT_VERSION}/onnxruntime"
DEST_APPLE_DIR_PATH = "${DEST_DIR_PATH}/apple"
DEST_ANDROID_DIR_PATH = "${DEST_DIR_PATH}/android"

[config]
default_to_workspace = false

[tasks.show]
category = "sdk"
description = "Show available tasks"
script = """
cargo make --makefile Makefile.toml --list-category-steps onnxruntime
"""

[tasks.clean]
category = "onnxruntime"
clear = true
description = "Clean build artifacts"
script = """
#!/usr/bin/env bash
echo "🔥 Cleaning build artifacts..."
(
    cd ${ONNXRUNTIME_DIR_PATH}
    rm -rf build
)
"""

[tasks.clean-ios]
category = "onnxruntime"
description = "Clean iOS build artifacts"
alias = "clean"

[tasks.clean-ios-sim]
category = "onnxruntime"
description = "Clean iOS simulator build artifacts"
alias = "clean"

[tasks.clean-ios-sim-x86_64]
category = "onnxruntime"
description = "Clean iOS simulator x86_64 build artifacts"
alias = "clean"

[tasks.clean-android]
category = "onnxruntime"
description = "Clean Android build artifacts"
alias = "clean"

[tasks.clean-macosx]
category = "onnxruntime"
description = "Clean macOS build artifacts"
alias = "clean"

[tasks.clean-macosx-python]
category = "onnxruntime"
description = "Clean macOS build artifacts"
alias = "clean"

[tasks.clean-linux-python]
category = "onnxruntime"
description = "Clean Linux Python build artifacts"
alias = "clean"

[tasks.all]
category = "onnxruntime"
description = "Build all binaries and package them"
dependencies = ["ios", "ios-sim", "ios-sim-x86_64", "macosx", "android", "package"]

[tasks.ios]
category = "onnxruntime"
description = "Build iOS binaries"
clear = true
dependencies = ["clean-ios"]
script = """
#!/usr/bin/env bash
echo "📱 Building iOS binaries..."
(
    cd ${ONNXRUNTIME_DIR_PATH}
    ./build.sh --config Release \
        --use_xcode \
        --ios \
        --apple_sysroot iphoneos \
        --osx_arch arm64 \
        --apple_deploy_target 16.4 \
        --build_apple_framework \
        --use_coreml \
        --no_kleidiai \
        --parallel
)

echo "📂 Creating destination directory at ${DEST_APPLE_DIR_PATH}..."
mkdir -p ${DEST_APPLE_DIR_PATH}/ios64/lib

echo "🚚 Copying built iOS framework to destination directory..."
cp ${ONNXRUNTIME_DIR_PATH}/build/iOS/Release/Release-iphoneos/static_framework/onnxruntime.framework/onnxruntime \
    ${DEST_APPLE_DIR_PATH}/ios64/lib/libonnxruntime.a
"""

[tasks.ios-sim]
category = "onnxruntime"
description = "Build iOS simulator binaries"
clear = true
dependencies = ["clean-ios-sim"]
script = """
#!/usr/bin/env bash
echo "📱 Building iOS simulator binaries..."
(
    cd ${ONNXRUNTIME_DIR_PATH}
    ./build.sh \
        --config Release \
        --use_xcode \
        --ios \
        --apple_sysroot iphonesimulator \
        --osx_arch arm64 \
        --apple_deploy_target 16.4 \
        --build_apple_framework \
        --use_coreml \
        --no_kleidiai \
        --parallel
)

echo "📂 Creating destination directory at ${DEST_APPLE_DIR_PATH}..."
mkdir -p ${DEST_APPLE_DIR_PATH}/simulator-arm64/lib

echo "🚚 Copying built iOS framework to destination directory..."
cp ${ONNXRUNTIME_DIR_PATH}/build/iOS/Release/Release-iphonesimulator/static_framework/onnxruntime.framework/onnxruntime \
    ${DEST_APPLE_DIR_PATH}/simulator-arm64/lib/libonnxruntime.a
"""

[tasks.ios-sim-x86_64]
category = "onnxruntime"
description = "Build iOS simulator x86_64 binaries"
dependencies = ["clean-ios-sim-x86_64"]
script = """
#!/usr/bin/env bash
echo "📱 Building iOS simulator x86_64 binaries..."
(
    cd ${ONNXRUNTIME_DIR_PATH}
    ./build.sh \
        --config Release \
        --use_xcode --ios \
        --apple_sysroot iphonesimulator \
        --osx_arch x86_64 \
        --apple_deploy_target 16.4 \
        --build_apple_framework \
        --use_coreml \
        --no_kleidiai \
        --parallel
)

echo "📂 Creating destination directory at ${DEST_APPLE_DIR_PATH}..."
mkdir -p ${DEST_APPLE_DIR_PATH}/simulator-x86_64/lib

echo "🚚 Copying built iOS framework to destination directory..."
cp ${ONNXRUNTIME_DIR_PATH}/build/iOS/Release/Release-iphonesimulator/static_framework/onnxruntime.framework/onnxruntime \
    ${DEST_APPLE_DIR_PATH}/simulator-x86_64/lib/libonnxruntime.a
"""

[tasks.macosx]
category = "onnxruntime"
description = "Build macOS binaries"
dependencies = ["clean-macosx"]
script = """
#!/usr/bin/env bash
echo "💻 Building macOS binaries..."
(
    cd ${ONNXRUNTIME_DIR_PATH}
    ./build.sh \
        --config Release \
        --use_xcode \
        --macos MacOSX \
        --apple_deploy_target 15.0 \
        --apple_sysroot macosx \
        --build_apple_framework \
        --use_coreml \
        --no_kleidiai \
        --use_vcpkg \
        --parallel
)

echo "📂 Creating destination directory at ${DEST_APPLE_DIR_PATH}..."
mkdir -p ${DEST_APPLE_DIR_PATH}/macosx/lib

echo "🚚 Copying built iOS framework to destination directory..."
cp ${ONNXRUNTIME_DIR_PATH}/build/MacOS/Release/Release-macosx/static_framework/onnxruntime.framework/onnxruntime \
    ${DEST_APPLE_DIR_PATH}/macosx/lib/libonnxruntime.a
"""

[tasks.macosx-python]
category = "onnxruntime"
description = "Build macOS binaries"
dependencies = ["clean-macosx-python"]
script = """
#!/usr/bin/env bash
echo "💻 Building macOS binaries..."
(
    cd ${ONNXRUNTIME_DIR_PATH}
    ./build.sh \
        --config Release \
        --update \
        --build \
        --build_shared_lib \
        --parallel \
        --compile_no_warning_as_error \
        --skip_submodule_sync \
        --use_xnnpack \
        --use_coreml \
        --no_kleidiai \
        --enable_pybind \
        --build_wheel \
        --use_vcpkg \
        --cmake_extra_defines \
        CMAKE_OSX_ARCHITECTURES=arm64

)

echo "📂 Creating destination directory at ${DEST_APPLE_DIR_PATH}..."
mkdir -p ${DEST_APPLE_DIR_PATH}/macosx/wheel

echo "🚚 Copying built ONNX Runtime wheel to destination directory..."
cp ${ONNXRUNTIME_DIR_PATH}/build/MacOS/Release/dist/onnxruntime-*.whl \
    ${DEST_APPLE_DIR_PATH}/macosx/wheel/
"""

[tasks.linux-python]
category = "onnxruntime"
description = "Build macOS binaries"
dependencies = ["clean-linux-python"]
script = """
#!/usr/bin/env bash
echo "💻 Building macOS binaries..."
(
    cd ${ONNXRUNTIME_DIR_PATH}
    ./build.sh \
        --config Release \
        --parallel \
        --use_xnnpack \
        --enable_pybind \
        --build_wheel \
        --cmake_extra_defines CMAKE_POLICY_VERSION_MINIMUM=3.5
)

echo "📂 Creating destination directory at ${DEST_APPLE_DIR_PATH}..."
mkdir -p ${DEST_APPLE_DIR_PATH}/linux/wheel

echo "🚚 Copying built ONNX Runtime wheel to destination directory..."
cp ${ONNXRUNTIME_DIR_PATH}/build/Linux/Release/dist/onnxruntime-*.whl \
    ${DEST_APPLE_DIR_PATH}/linux/wheel/
"""

[tasks.android]
category = "onnxruntime"
description = "Build Android binaries"
env_files = ["./android.env"]
env.ANDROID_NDK_HOME = "${ANDROID_SDK_HOME}/ndk/${ANDROID_NDK_VERSION}"
clear = true
dependencies = ["clean-android"]
script = """
#!/usr/bin/env bash
echo "🤖 Building Android binaries..."

(
    cd ${ONNXRUNTIME_DIR_PATH}
    ./build.sh \
        --android \
        --android_sdk_path ${ANDROID_SDK_HOME} \
        --android_ndk_path ${ANDROID_NDK_HOME} \
        --android_abi arm64-v8a \
        --android_api 27 \
        --use_xnnpack \
        --config Release \
        --build_shared_lib \
        --parallel
)

echo "📂 Creating destination directory at ${DEST_ANDROID_DIR_PATH}..."
mkdir -p ${DEST_ANDROID_DIR_PATH}/arm64-v8a/lib

echo "🚚 Copying built ONNX Runtime wheel to destination directory..."
cp ${ONNXRUNTIME_DIR_PATH}/build/Android/Release/libonnxruntime.so \
    ${DEST_ANDROID_DIR_PATH}/arm64-v8a/lib/libonnxruntime.so
"""

[tasks.package]
category = "onnxruntime"
clear = true
description = "Verify built binaries and package them in edge-vision-toolkit sdk/third_party/onnxruntime layout"
script = """
#!/usr/bin/env bash
set -euo pipefail

PKG_ROOT="$(dirname ${DEST_DIR_PATH})"
ZIP_PATH="${PKG_ROOT}/onnxruntime-${ORT_VERSION}.zip"

# path:expected-architecture
EXPECTED=(
    "apple/ios64/lib/libonnxruntime.a:arm64"
    "apple/simulator-arm64/lib/libonnxruntime.a:arm64"
    "apple/simulator-x86_64/lib/libonnxruntime.a:x86_64"
    "apple/macosx/lib/libonnxruntime.a:arm64"
    "android/arm64-v8a/lib/libonnxruntime.so:aarch64"
)

echo "🔍 Verifying binaries in ${DEST_DIR_PATH}..."
missing=0
for entry in "${EXPECTED[@]}"; do
    rel="${entry%%:*}"
    arch="${entry##*:}"
    path="${DEST_DIR_PATH}/${rel}"
    if [ ! -f "${path}" ]; then
        echo "  ❌ missing: ${rel}"
        missing=1
        continue
    fi
    if [[ "${rel}" == *.a ]]; then
        info="$(lipo -info "${path}")"
    else
        info="$(file "${path}")"
    fi
    if ! grep -qi "${arch}" <<< "${info}"; then
        echo "  ❌ unexpected architecture (want ${arch}): ${rel}"
        echo "     ${info}"
        missing=1
        continue
    fi
    echo "  ✅ ${rel} ($(du -h "${path}" | cut -f1), ${arch})"
done
if [ "${missing}" -ne 0 ]; then
    echo "🚨 Some binaries are missing or invalid. Run the corresponding build tasks first." >&2
    exit 1
fi

echo "📦 Creating ${ZIP_PATH}..."
rm -f "${ZIP_PATH}"
(
    cd "${PKG_ROOT}"
    zip -qry "$(basename ${ZIP_PATH})" onnxruntime
)

echo "🎉 Done."
echo "   folder: ${DEST_DIR_PATH}  ->  copy to edge-vision-toolkit/sdk/third_party/onnxruntime"
echo "   zip   : ${ZIP_PATH}"
"""
